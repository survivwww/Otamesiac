<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>おためしアクション</title>
<style>
  :root { color-scheme: light; --ink:#111; --paper:#fff; --line:3px solid #111; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  body { touch-action:none; }
  button { color:var(--ink); background:#fff; border:2px solid #111; border-radius:12px; font:inherit; font-weight:800; cursor:pointer; touch-action: manipulation; -webkit-tap-highlight-color:transparent; }
  button:active { background:#e8e8e8; transform:translateY(1px); }
  button:focus-visible { outline:3px dashed #111; outline-offset:3px; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.active { display:flex; }
  #home, #select { align-items:center; justify-content:center; flex-direction:column; gap:22px; padding:24px; text-align:center; }
  h1 { margin:0; font-size:clamp(2rem,8vw,3.3rem); letter-spacing:.08em; }
  .subtitle { margin:0; font-size:.95rem; }
  .main-btn { min-width:min(72vw,300px); min-height:64px; font-size:1.25rem; }
  .stage-buttons { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .stage-btn { width:76px; height:76px; font-size:1.6rem; border-radius:50%; }
  .stage-btn.locked { color:#bbb; border-color:#ccc; background:#f7f7f7; cursor:not-allowed; }
  .small-btn { min-height:48px; padding:8px 18px; }
  .select-note { min-height:1.4em; margin:0; color:#444; }
  #game { background:#fff; flex-direction:column; }
  #gameTop { position:absolute; z-index:2; top:env(safe-area-inset-top, 0px); left:0; right:0; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; pointer-events:none; }
  #gameTop > * { pointer-events:auto; }
  #stageLabel { font-weight:900; background:rgba(255,255,255,.92); padding:6px 10px; border:2px solid #111; border-radius:8px; }
  #hint { position:absolute; top:58px; left:50%; transform:translateX(-50%); width:max-content; max-width:92vw; text-align:center; font-size:.78rem; background:rgba(255,255,255,.9); padding:5px 8px; border-radius:6px; pointer-events:none; }
  canvas { display:block; width:100%; height:100%; }
  #controls { position:absolute; inset:auto 0 max(12px, env(safe-area-inset-bottom, 12px)) 0; display:flex; align-items:flex-end; justify-content:space-between; padding:0 18px; pointer-events:none; }
  .control-cluster { display:flex; gap:12px; pointer-events:auto; }
  .control-btn { width:clamp(62px,18vw,82px); height:clamp(62px,18vw,82px); border:2px solid #111; border-radius:18px; font-size:2rem; line-height:1; box-shadow:0 3px 0 #111; user-select:none; -webkit-user-select:none; touch-action:none; }
  .control-btn.pressed { background:#ddd; box-shadow:0 1px 0 #111; transform:translateY(2px); }
  #toast { position:absolute; z-index:4; inset:0; display:none; align-items:center; justify-content:center; background:rgba(255,255,255,.86); padding:24px; text-align:center; }
  #toast.show { display:flex; }
  .toast-card { border:3px solid #111; border-radius:18px; padding:24px; width:min(90vw,360px); background:#fff; }
  .toast-card h2 { margin:0 0 10px; font-size:2rem; }
  .toast-card p { margin:0 0 18px; }
  .toast-card button { min-height:52px; padding:8px 18px; width:100%; }
  .help { font-size:.85rem; line-height:1.7; max-width:340px; }
  @media (max-height:520px) {
    #home,#select { gap:12px; }
    h1 { font-size:2rem; }
    .main-btn { min-height:52px; }
    .stage-btn { width:60px; height:60px; }
    .control-btn { width:58px; height:58px; }
    #hint { top:52px; }
  }
</style>
</head>
<body>
<section id="home" class="screen active">
  <h1>おためしアクション</h1>
  <p class="subtitle">走って、跳んで、ゴールを目指そう。</p>
  <button id="goSelect" class="main-btn">ステージ選択</button>
  <p class="help">操作：画面左の ← → で移動、右の ↑ でジャンプ。<br>白と黒だけのシンプルアクションゲーム。</p>
</section>

<section id="select" class="screen">
  <h1>ステージ選択</h1>
  <p class="subtitle">クリアすると次のステージが解放されます。</p>
  <div class="stage-buttons">
    <button class="stage-btn" data-stage="0">1</button>
    <button class="stage-btn locked" data-stage="1" disabled>2</button>
    <button class="stage-btn locked" data-stage="2" disabled>3</button>
  </div>
  <p id="selectNote" class="select-note">ステージ1から挑戦しよう。</p>
  <button id="backHome" class="small-btn">ホームに戻る</button>
</section>

<section id="game" class="screen">
  <div id="gameTop">
    <button id="exitGame" class="small-btn">ステージ選択</button>
    <span id="stageLabel">STAGE 1</span>
    <button id="restart" class="small-btn">やり直す</button>
  </div>
  <div id="hint">← → 移動　／　↑ ジャンプ</div>
  <canvas id="world" aria-label="アクションゲーム画面"></canvas>
  <div id="controls">
    <div class="control-cluster">
      <button class="control-btn" data-control="left" aria-label="左へ移動">←</button>
      <button class="control-btn" data-control="right" aria-label="右へ移動">→</button>
    </div>
    <div class="control-cluster">
      <button class="control-btn" data-control="jump" aria-label="ジャンプ">↑</button>
    </div>
  </div>
  <div id="toast">
    <div class="toast-card">
      <h2 id="toastTitle">クリア！</h2>
      <p id="toastText">ステージクリア！</p>
      <button id="toastButton">ステージ選択へ</button>
    </div>
  </div>
</section>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const screens = { home: $("#home"), select: $("#select"), game: $("#game") };
  const canvas = $("#world"), ctx = canvas.getContext("2d");
  const controls = { left:false, right:false, jump:false };
  let currentStage = 0, unlocked = 1, raf = 0, lastTime = 0, world = null;
  let cameraX = 0, gameActive = false, jumpWasDown = false, frame = 0;
  const GRAVITY = 1750;

  const stageSpecs = [
    {
      name:"はじめの道", width:1900, spawn:{x:55,y:0}, goalX:1800,
      platforms:[
        [0,0,370,28],[440,0,260,28],[770,0,250,28],[1090,0,270,28],[1430,0,470,28],
        [280,110,90,18],[610,155,90,18],[890,105,90,18],[1220,155,90,18]
      ],
      enemies:[{type:"walker",x:235,y:0,min:150,max:340,speed:65,w:28,h:28},{type:"hopper",x:850,y:0,min:790,max:990,speed:70,w:28,h:28}],
      hazards:[[370,0,70,28],[700,0,70,28],[1020,0,70,28],[1360,0,70,28]],
      movers:[], switches:[], gates:[], movingSpikes:[], wind:0
    },
    {
      name:"動く足場", width:2250, spawn:{x:45,y:0}, goalX:2150,
      platforms:[[0,0,270,28],[430,0,230,28],[820,0,220,28],[1200,0,220,28],[1600,0,250,28],[1990,0,260,28],[280,110,85,16],[650,150,95,16],[1030,105,90,16],[1430,145,100,16],[1850,110,90,16]],
      enemies:[{type:"walker",x:155,y:0,min:75,max:245,speed:72,w:28,h:28},{type:"hopper",x:870,y:0,min:830,max:1000,speed:85,w:28,h:28},{type:"charger",x:1660,y:0,min:1610,max:1815,speed:130,w:32,h:28}],
      hazards:[[270,0,160,28],[660,0,160,28],[1040,0,160,28],[1420,0,180,28],[1850,0,140,28]],
      movers:[{x:340,y:145,w:85,h:16,axis:"y",range:85,speed:1.1,phase:0.2},{x:700,y:205,w:90,h:16,axis:"x",range:70,speed:1.3,phase:1.2},{x:1090,y:160,w:90,h:16,axis:"y",range:90,speed:1.0,phase:2.1},{x:1500,y:220,w:85,h:16,axis:"x",range:80,speed:1.1,phase:0.8}],
      switches:[{x:930,y:0,r:14,used:false}], gates:[{x:1880,y:0,w:20,h:120,open:false,switchIndex:0}], movingSpikes:[], wind:0
    },
    {
      name:"最後の試練", width:2600, spawn:{x:45,y:0}, goalX:2500,
      platforms:[[0,0,250,28],[410,0,180,28],[740,0,190,28],[1080,0,180,28],[1430,0,180,28],[1780,0,190,28],[2130,0,180,28],[2420,0,180,28],[260,115,85,16],[590,165,85,16],[920,120,85,16],[1250,175,85,16],[1600,125,85,16],[1950,170,85,16],[2300,120,85,16]],
      enemies:[
        {type:"walker",x:115,y:0,min:45,max:225,speed:85,w:28,h:28},
        {type:"hopper",x:790,y:0,min:745,max:900,speed:95,w:28,h:28},
        {type:"charger",x:1470,y:0,min:1435,max:1580,speed:160,w:32,h:28},
        {type:"flyer",x:1880,y:140,min:1830,max:2040,speed:95,w:30,h:24},
        {type:"flyer",x:2250,y:120,min:2190,max:2370,speed:125,w:30,h:24}
      ],
      hazards:[[250,0,160,28],[590,0,150,28],[930,0,150,28],[1260,0,170,28],[1610,0,170,28],[1970,0,160,28],[2310,0,110,28]],
      movers:[{x:300,y:165,w:80,h:16,axis:"y",range:90,speed:1.4,phase:0.5},{x:650,y:220,w:85,h:16,axis:"x",range:70,speed:1.4,phase:1.5},{x:970,y:170,w:80,h:16,axis:"y",range:90,speed:1.5,phase:2.4},{x:1310,y:230,w:80,h:16,axis:"x",range:80,speed:1.5,phase:0.9},{x:1660,y:180,w:80,h:16,axis:"y",range:80,speed:1.4,phase:2.1},{x:2010,y:220,w:80,h:16,axis:"x",range:65,speed:1.5,phase:0.1}],
      switches:[{x:850,y:0,r:14,used:false},{x:1830,y:0,r:14,used:false}],
      gates:[{x:1020,y:0,w:20,h:125,open:false,switchIndex:0},{x:2070,y:0,w:20,h:135,open:false,switchIndex:1}],
      movingSpikes:[{x:550,y:55,w:42,h:30,axis:"y",range:55,speed:1.8,phase:0},{x:1180,y:60,w:42,h:30,axis:"y",range:45,speed:2,phase:1.2},{x:1900,y:55,w:42,h:30,axis:"y",range:55,speed:1.9,phase:2}],
      wind:0
    }
  ];

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
  }
  function updateStageButtons() {
    document.querySelectorAll(".stage-btn").forEach(btn => {
      const n = Number(btn.dataset.stage);
      const locked = n >= unlocked;
      btn.disabled = locked;
      btn.classList.toggle("locked", locked);
      btn.setAttribute("aria-label", `ステージ${n+1}${locked ? "（未解放）" : ""}`);
    });
    $("#selectNote").textContent = `解放済み：${unlocked} / 3 ステージ`;
  }
  $("#goSelect").addEventListener("click", () => { updateStageButtons(); showScreen("select"); });
  $("#backHome").addEventListener("click", () => showScreen("home"));
  $("#exitGame").addEventListener("click", returnToSelect);
  $("#restart").addEventListener("click", () => startStage(currentStage));
  document.querySelectorAll(".stage-btn").forEach(btn => btn.addEventListener("click", () => {
    const n = Number(btn.dataset.stage);
    if (n < unlocked) startStage(n);
  }));
  $("#toastButton").addEventListener("click", returnToSelect);

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(rect.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", resizeCanvas);

  function startStage(index) {
    currentStage = index;
    const spec = stageSpecs[index];
    world = {
      spec, time:0, player:{x:spec.spawn.x,y:0,vx:0,vy:0,w:22,h:54,onGround:false,face:1,anim:0,dead:false},
      enemies:spec.enemies.map(e => ({...e,baseY:e.y,dir:1,phase:Math.random()*4,alive:true,stun:0})),
      movers:spec.movers.map(m => ({...m,baseX:m.x,baseY:m.y,px:m.x,py:m.y})),
      switches:spec.switches.map(s => ({...s,used:false})),
      gates:spec.gates.map(g => ({...g,open:false})),
      movingSpikes:spec.movingSpikes.map(s => ({...s,baseY:s.y,baseX:s.x})),
      camera:0, checkpointX:spec.spawn.x, won:false, invuln:0
    };
    cameraX = 0; gameActive = true; jumpWasDown = false;
    $("#stageLabel").textContent = `STAGE ${index+1}　${spec.name}`;
    $("#toast").classList.remove("show");
    showScreen("game"); resizeCanvas();
    lastTime = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }
  function returnToSelect() {
    gameActive = false; cancelAnimationFrame(raf);
    $("#toast").classList.remove("show");
    updateStageButtons(); showScreen("select");
    Object.keys(controls).forEach(k => controls[k] = false);
    document.querySelectorAll(".control-btn").forEach(b => b.classList.remove("pressed"));
  }
  function finishStage(won) {
    if (!gameActive) return;
    gameActive = false;
    if (won) {
      unlocked = Math.max(unlocked, Math.min(3,currentStage+2));
      $("#toastTitle").textContent = "ステージクリア！";
      $("#toastText").textContent = currentStage < 2 ? `ステージ${currentStage+1}をクリア！ 次のステージが解放されました。` : "全3ステージ制覇！ お見事！";
    } else {
      $("#toastTitle").textContent = "もう一度！";
      $("#toastText").textContent = "トゲや敵にぶつかったよ。タイミングを変えて挑戦しよう。";
      $("#toastButton").textContent = "ステージ選択へ";
    }
    $("#toast").classList.add("show");
  }
  function respawn() {
    const p = world.player, spec = world.spec;
    p.x = Math.max(20,world.checkpointX); p.y = 0; p.vx=0; p.vy=0; p.onGround=false;
    world.invuln = 1.25;
  }

  function loop(now) {
    if (!gameActive || !world) return;
    const dt = Math.min((now-lastTime)/1000,0.032);
    lastTime = now; frame++;
    update(dt); draw();
    if (gameActive) raf = requestAnimationFrame(loop);
  }
  function update(dt) {
    const w = world, p = w.player, spec = w.spec;
    w.time += dt; p.anim += dt * (Math.abs(controls.left || controls.right ? 8 : 2));
    if (w.invuln > 0) w.invuln -= dt;
    // Direct movement: no acceleration or inertia.
    const speed = currentStage === 2 ? 245 : 230;
    p.vx = (controls.right ? speed : 0) - (controls.left ? speed : 0);
    if (p.vx) p.face = Math.sign(p.vx);
    if (controls.jump && !jumpWasDown && p.onGround) { p.vy = 620; p.onGround = false; }
    jumpWasDown = controls.jump;
    p.vy -= GRAVITY*dt;
    p.x += p.vx*dt;
    p.x = Math.max(0,Math.min(spec.width-p.w,p.x));
    const oldY = p.y;
    p.y += p.vy*dt;
    p.onGround = false;

    // Static platforms: coordinates are measured up from the floor.
    const oldBottom = oldY + p.h;
    const newBottom = p.y + p.h;
    for (const plat of spec.platforms) {
      const [x,y,width,height] = plat;
      const screenTop = groundY() - y - height;
      const screenBottom = groundY() - y;
      const prevScreenBottom = groundY() - oldBottom;
      const nextScreenBottom = groundY() - newBottom;
      // Player coordinate is bottom-up world units; land when falling onto platform.
      if (p.vy <= 0 && p.x+p.w > x && p.x < x+width && oldY >= y+height-2 && p.y <= y+height && y > 0) {
        p.y = y+height; p.vy=0; p.onGround=true;
      }
      // Ground platform
      if (y === 0 && p.x+p.w > x && p.x < x+width && p.y+p.h >= 0) {
        // Gaps are handled by falling below the world.
      }
    }
    // Movers move on their own simple loops and can be stood on.
    for (const m of w.movers) {
      m.px = m.x; m.py = m.y;
      const wave = Math.sin(w.time*m.speed*2 + m.phase);
      if (m.axis === "x") m.x = m.baseX + wave*m.range;
      else m.y = m.baseY + wave*m.range;
      if (p.vy <= 0 && p.x+p.w > m.x && p.x < m.x+m.w && oldY >= m.y && p.y <= m.y) {
        p.y = m.y; p.vy=0; p.onGround=true;
      }
    }
    // Floor sections; gaps are pits. Platforms with y=0 are floor strips.
    let supported = false;
    for (const [x,y,width] of spec.platforms) {
      if (y===0 && p.x+p.w > x && p.x < x+width && p.y <= 0) { p.y=0; p.vy=0; p.onGround=true; supported=true; }
    }
    if (p.y < -170 || p.y > 950) { respawn(); return; }
    // Enemy movement and contact.
    for (const e of w.enemies) {
      if (!e.alive) continue;
      e.phase += dt;
      if (e.type === "walker") {
        e.x += e.dir*e.speed*dt;
        if (e.x < e.min || e.x+e.w > e.max) e.dir *= -1;
      } else if (e.type === "hopper") {
        e.x += e.dir*e.speed*dt;
        if (e.x < e.min || e.x+e.w > e.max) e.dir *= -1;
        e.y = Math.max(0, Math.abs(Math.sin(e.phase*2.3))*85);
      } else if (e.type === "charger") {
        const dx = (p.x+p.w/2)-(e.x+e.w/2);
        if (Math.abs(dx)<260) e.dir = Math.sign(dx)||e.dir;
        e.x += e.dir*e.speed*dt;
        if (e.x<e.min || e.x+e.w>e.max) e.dir *= -1;
      } else if (e.type === "flyer") {
        e.x += e.dir*e.speed*dt;
        if (e.x<e.min || e.x+e.w>e.max) e.dir *= -1;
        e.y = e.baseY + Math.sin(e.phase*2.4)*30;
      }
      const ex = e.x, ey = e.y;
      if (rects(p.x,p.y,p.w,p.h,ex,ey,e.w,e.h)) {
        // Jumping on an enemy defeats it; side contact costs a life attempt.
        if (p.vy < -80 && p.y > ey + e.h*0.45) { e.alive=false; p.vy=340; }
        else if (w.invuln<=0) { respawn(); return; }
      }
    }
    // Spikes and moving spikes.
    for (const [x,y,width,height] of spec.hazards) {
      if (rects(p.x,p.y,p.w,p.h,x,y,width,height)) { respawn(); return; }
    }
    for (const s of w.movingSpikes) {
      s.y = s.baseY + Math.sin(w.time*s.speed*2+s.phase)*s.range;
      if (rects(p.x,p.y,p.w,p.h,s.x,s.y,s.w,s.h)) { respawn(); return; }
    }
    // Switches toggle gates when touched.
    for (const s of w.switches) {
      if (!s.used && Math.hypot((p.x+p.w/2)-(s.x),(p.y+p.h/2)-(s.y+18))<42) {
        s.used=true;
        w.gates.forEach(g => { if (g.switchIndex === w.switches.indexOf(s)) g.open=true; });
        w.checkpointX = Math.max(w.checkpointX, s.x-45);
      }
    }
    for (const g of w.gates) {
      if (!g.open && rects(p.x,p.y,p.w,p.h,g.x,g.y,g.w,g.h)) {
        p.x = p.x < g.x ? g.x-p.w : g.x+g.w;
      }
    }
    // Goal marker
    if (p.x+p.w >= spec.goalX) { finishStage(true); return; }
    // Camera follows player while keeping the course readable.
    const viewW = canvas.clientWidth;
    cameraX = Math.max(0,Math.min(spec.width-viewW,p.x-viewW*0.35));
    w.camera = cameraX;
  }
  function rects(ax,ay,aw,ah,bx,by,bw,bh) {
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }
  function groundY() { return canvas.clientHeight - 68; }

  function draw() {
    if (!world) return;
    const w=world, spec=w.spec, p=w.player;
    const W=canvas.clientWidth, H=canvas.clientHeight;
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    const ground=groundY();
    ctx.save(); ctx.translate(-cameraX,0);
    // faint guide marks
    ctx.strokeStyle="#eee"; ctx.lineWidth=1;
    for (let x=Math.floor(cameraX/50)*50; x<cameraX+W+50; x+=50) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,ground); ctx.stroke();
    }
    // Platforms and floor
    ctx.fillStyle="#111";
    for (const [x,y,width,height] of spec.platforms) {
      const sy=ground-y-height;
      ctx.fillRect(x,sy,width,height);
      ctx.fillStyle="#777"; ctx.fillRect(x,sy,width,3); ctx.fillStyle="#111";
    }
    // Spikes as triangles on ground or platform level
    for (const [x,y,width,height] of spec.hazards) {
      const baseY=ground-y;
      const count=Math.max(2,Math.floor(width/18));
      ctx.fillStyle="#111";
      for(let i=0;i<count;i++) {
        const sx=x+i*width/count, sw=width/count;
        ctx.beginPath(); ctx.moveTo(sx,baseY); ctx.lineTo(sx+sw/2,baseY-height-5); ctx.lineTo(sx+sw,baseY); ctx.closePath(); ctx.fill();
      }
    }
    // Moving platforms
    for (const m of w.movers) {
      const sy=ground-m.y-m.h;
      ctx.fillStyle="#fff"; ctx.fillRect(m.x,sy,m.w,m.h);
      ctx.strokeStyle="#111"; ctx.lineWidth=3; ctx.strokeRect(m.x,sy,m.w,m.h);
      ctx.beginPath(); ctx.moveTo(m.x+8,sy+m.h/2); ctx.lineTo(m.x+m.w-8,sy+m.h/2); ctx.stroke();
    }
    // Switches and gates
    for (const s of w.switches) {
      const sy=ground-s.y-30;
      ctx.strokeStyle="#111"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(s.x,sy,14,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=s.used?"#111":"#fff"; ctx.fill();
      ctx.fillStyle=s.used?"#fff":"#111"; ctx.font="bold 14px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("!",s.x,sy);
    }
    for (const g of w.gates) {
      if (!g.open) {
        ctx.fillStyle="#fff"; ctx.fillRect(g.x,ground-g.y-g.h,g.w,g.h);
        ctx.strokeStyle="#111"; ctx.lineWidth=3; ctx.strokeRect(g.x,ground-g.y-g.h,g.w,g.h);
        for(let y=ground-g.y-g.h+10;y<ground-g.y-5;y+=18) { ctx.beginPath(); ctx.moveTo(g.x,y); ctx.lineTo(g.x+g.w,y+7); ctx.stroke(); }
      }
    }
    for (const s of w.movingSpikes) {
      const sy=ground-s.y-s.h;
      ctx.fillStyle="#111";
      for(let i=0;i<3;i++) {
        ctx.beginPath(); ctx.moveTo(s.x+i*s.w/3,sy+s.h); ctx.lineTo(s.x+(i+.5)*s.w/3,sy); ctx.lineTo(s.x+(i+1)*s.w/3,sy+s.h); ctx.fill();
      }
    }
    // Enemies, each has a distinct silhouette.
    for (const e of w.enemies) if (e.alive) {
      const ex=e.x, ey=ground-e.y-e.h;
      ctx.strokeStyle="#111"; ctx.fillStyle="#fff"; ctx.lineWidth=3;
      if (e.type==="walker") {
        ctx.fillRect(ex,ey+6,e.w,e.h-6); ctx.strokeRect(ex,ey+6,e.w,e.h-6);
        ctx.fillStyle="#111"; ctx.fillRect(ex+7,ey+12,4,4); ctx.fillRect(ex+e.w-11,ey+12,4,4);
        ctx.beginPath(); ctx.moveTo(ex+5,ey+e.h); ctx.lineTo(ex+3,ey+e.h+5); ctx.moveTo(ex+e.w-5,ey+e.h); ctx.lineTo(ex+e.w-3,ey+e.h+5); ctx.stroke();
      } else if (e.type==="hopper") {
        ctx.beginPath(); ctx.ellipse(ex+e.w/2,ey+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex+5,ey+e.h); ctx.lineTo(ex,ey+e.h+5); ctx.moveTo(ex+e.w-5,ey+e.h); ctx.lineTo(ex+e.w,ey+e.h+5); ctx.stroke();
        ctx.fillStyle="#111"; ctx.fillRect(ex+8,ey+8,4,4); ctx.fillRect(ex+e.w-12,ey+8,4,4);
      } else if (e.type==="charger") {
        ctx.beginPath(); ctx.moveTo(ex,ey+e.h); ctx.lineTo(ex+5,ey+4); ctx.lineTo(ex+e.w-5,ey+4); ctx.lineTo(ex+e.w,ey+e.h); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex+e.w/2,ey+4); ctx.lineTo(ex+e.w/2,ey-5); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.ellipse(ex+e.w/2,ey+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex+4,ey+8); ctx.lineTo(ex-8,ey); ctx.lineTo(ex+8,ey+10); ctx.moveTo(ex+e.w-4,ey+8); ctx.lineTo(ex+e.w+8,ey); ctx.lineTo(ex+e.w-8,ey+10); ctx.stroke();
        ctx.fillStyle="#111"; ctx.fillRect(ex+8,ey+8,4,4); ctx.fillRect(ex+e.w-12,ey+8,4,4);
      }
    }
    // Goal flag
    const gx=spec.goalX;
    ctx.strokeStyle="#111"; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(gx,ground); ctx.lineTo(gx,ground-100); ctx.stroke();
    ctx.fillStyle="#111"; ctx.beginPath(); ctx.moveTo(gx,ground-100); ctx.lineTo(gx+48,ground-84); ctx.lineTo(gx,ground-68); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText("GOAL",gx+19,ground-83);
    // Stick figure player (coordinates bottom-up converted to screen).
    const px=p.x+p.w/2, py=ground-p.y-p.h;
    ctx.save(); ctx.translate(px,py); ctx.scale(p.face,1);
    ctx.strokeStyle="#111"; ctx.fillStyle="#fff"; ctx.lineWidth=3.2; ctx.lineCap="round"; ctx.lineJoin="round";
    if (w.invuln>0 && Math.floor(w.time*12)%2===0) ctx.globalAlpha=.35;
    ctx.beginPath(); ctx.arc(0,8,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(0,34); ctx.stroke();
    const moving = Math.abs(p.vx)>0 && p.onGround;
    const swing = moving ? Math.sin(p.anim*1.8)*9 : 0;
    const armSwing = moving ? Math.sin(p.anim*1.8+Math.PI)*7 : 0;
    ctx.beginPath(); ctx.moveTo(0,21); ctx.lineTo(-9+armSwing,29); ctx.moveTo(0,21); ctx.lineTo(9-armSwing,29); ctx.stroke();
    ctx.beginPath();
    if (!p.onGround) {
      ctx.moveTo(0,34); ctx.lineTo(-10,43); ctx.moveTo(0,34); ctx.lineTo(10,42);
    } else {
      ctx.moveTo(0,34); ctx.lineTo(-7+swing,49); ctx.moveTo(0,34); ctx.lineTo(7-swing,49);
    }
    ctx.stroke();
    // Tiny face
    ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(-3,7,1.4,0,Math.PI*2); ctx.fill();
    ctx.restore(); ctx.restore();
    // Progress line
    ctx.fillStyle="#111"; ctx.fillRect(12,H-9,(W-24)*Math.min(1,p.x/spec.goalX),3);
    ctx.fillStyle="#fff"; ctx.strokeStyle="#111"; ctx.lineWidth=2; ctx.strokeRect(12,H-9,W-24,3);
  }

  // Touch controls support press-and-hold and release outside the button.
  function setControl(name, value, button) {
    controls[name]=value;
    if (button) button.classList.toggle("pressed",value);
  }
  document.querySelectorAll(".control-btn").forEach(btn => {
    const name=btn.dataset.control;
    btn.addEventListener("pointerdown", e => {
      e.preventDefault(); btn.setPointerCapture?.(e.pointerId); setControl(name,true,btn);
    });
    const release = e => { e.preventDefault(); setControl(name,false,btn); };
    btn.addEventListener("pointerup",release);
    btn.addEventListener("pointercancel",release);
    btn.addEventListener("lostpointercapture",() => setControl(name,false,btn));
    btn.addEventListener("contextmenu",e=>e.preventDefault());
  });
  window.addEventListener("keydown", e => {
    const key=e.key.toLowerCase();
    if(["arrowleft","a"].includes(key)) controls.left=true;
    if(["arrowright","d"].includes(key)) controls.right=true;
    if(["arrowup"," ","w"].includes(key)) { controls.jump=true; e.preventDefault(); }
  });
  window.addEventListener("keyup", e => {
    const key=e.key.toLowerCase();
    if(["arrowleft","a"].includes(key)) controls.left=false;
    if(["arrowright","d"].includes(key)) controls.right=false;
    if(["arrowup"," ","w"].includes(key)) controls.jump=false;
  });
  window.addEventListener("blur", () => { Object.keys(controls).forEach(k=>controls[k]=false); });
  updateStageButtons();
})();
</script>
</body>
</html>
